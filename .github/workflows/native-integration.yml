name: Native Whisper integration

on:
  pull_request:
    paths:
      - ".github/workflows/native-integration.yml"
      - "conformance/audio-manifest.json"
      - "constraints/native-integration.txt"
      - "docs/REAL_BACKEND_QUICKSTART.md"
      - "examples/native_transaction.py"
      - "patches/openai-whisper/**"
      - "src/whisper_runtime/**"
      - "evidence/native-interleaving.schema.json"
      - "evidence/native-threaded.schema.json"
      - "pyproject.toml"
      - "tools/check_repository.py"
      - "tools/bootstrap_native_backend.py"
      - "tools/native_backend_setup.py"
      - "tools/run_native_example.py"
      - "tools/smoke_native_whisper.py"
      - "tools/validate_interleaving_record.py"
      - "tools/validate_threaded_record.py"
      - "tools/verify_native_interleaving.py"
      - "tools/verify_native_threaded.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-integration.yml"
      - "conformance/audio-manifest.json"
      - "constraints/native-integration.txt"
      - "docs/REAL_BACKEND_QUICKSTART.md"
      - "examples/native_transaction.py"
      - "patches/openai-whisper/**"
      - "src/whisper_runtime/**"
      - "evidence/native-interleaving.schema.json"
      - "evidence/native-threaded.schema.json"
      - "pyproject.toml"
      - "tools/check_repository.py"
      - "tools/bootstrap_native_backend.py"
      - "tools/native_backend_setup.py"
      - "tools/run_native_example.py"
      - "tools/smoke_native_whisper.py"
      - "tools/validate_interleaving_record.py"
      - "tools/validate_threaded_record.py"
      - "tools/verify_native_interleaving.py"
      - "tools/verify_native_threaded.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tiny-en-cpu:
    name: Patched decoder and tiny.en on CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version

      - name: Build the verified native environment
        shell: bash
        run: |
          native_root="$RUNNER_TEMP/native"
          python -B tools/bootstrap_native_backend.py --root "$native_root"
          python -B tools/bootstrap_native_backend.py \
            --root "$native_root" \
            --verify-only
          backend="$native_root/backend"
          native_python="$native_root/venv/bin/python"
          echo "NATIVE_ROOT=$native_root" >> "$GITHUB_ENV"
          echo "WHISPER_BACKEND=$backend" >> "$GITHUB_ENV"
          echo "NATIVE_PYTHON=$native_python" >> "$GITHUB_ENV"

      - name: Run the documented native example
        shell: bash
        run: |
          python -B tools/run_native_example.py \
            --root "$NATIVE_ROOT" \
            --model-cache "$RUNNER_TEMP/whisper-models" \
            --allow-model-download

      - name: Verify same-model staged-run isolation
        shell: bash
        run: |
          revision="$(git -C "$WHISPER_BACKEND" rev-parse HEAD)"
          PYTHONPATH="$WHISPER_BACKEND:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" \
            "$NATIVE_PYTHON" -B tools/verify_native_interleaving.py \
            "$WHISPER_BACKEND/tests/jfk.flac" \
            --model tiny.en \
            --fixture-id "openai-whisper-jfk-flac" \
            --input-label "tests/jfk.flac" \
            --download-root "$RUNNER_TEMP/whisper-models" \
            --base-revision "86098128c0b4f24f0e2aa2994de830614b474227" \
            --revision "$revision" \
            --expected-model-fingerprint "sha256:8041a80119a588f542472da35e97d0372fce1d9709ed9874475e9c03deac5de6" \
            --expected-text "And so my fellow Americans ask not what your country can do for you, ask what you can do for your country." \
            | tee "$RUNNER_TEMP/native-interleaving.json"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" \
            "$NATIVE_PYTHON" -B tools/validate_interleaving_record.py \
            "$RUNNER_TEMP/native-interleaving.json"

      - name: Publish the interleaving evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-interleaving-${{ github.sha }}
          path: ${{ runner.temp }}/native-interleaving.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify same-model OS-thread isolation
        shell: bash
        run: |
          revision="$(git -C "$WHISPER_BACKEND" rev-parse HEAD)"
          PYTHONPATH="$WHISPER_BACKEND:$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" \
            "$NATIVE_PYTHON" -B tools/verify_native_threaded.py \
            "$WHISPER_BACKEND/tests/jfk.flac" \
            --model tiny.en \
            --fixture-id "openai-whisper-jfk-flac" \
            --input-label "tests/jfk.flac" \
            --download-root "$RUNNER_TEMP/whisper-models" \
            --base-revision "86098128c0b4f24f0e2aa2994de830614b474227" \
            --revision "$revision" \
            --expected-model-fingerprint "sha256:8041a80119a588f542472da35e97d0372fce1d9709ed9874475e9c03deac5de6" \
            --expected-text "And so my fellow Americans ask not what your country can do for you, ask what you can do for your country." \
            | tee "$RUNNER_TEMP/native-threaded.json"
          PYTHONPATH="$GITHUB_WORKSPACE/src:$GITHUB_WORKSPACE" \
            "$NATIVE_PYTHON" -B tools/validate_threaded_record.py \
            "$RUNNER_TEMP/native-threaded.json"

      - name: Publish the OS-thread evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-threaded-${{ github.sha }}
          path: ${{ runner.temp }}/native-threaded.json
          if-no-files-found: error
          retention-days: 30
