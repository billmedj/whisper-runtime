name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Runtime model (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
          - macos-15
        python:
          - "3.10"
          - "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: python -m pip install --no-deps .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run runtime tests against installed package
        run: python -B -m unittest discover -s tests -v

  contracts:
    name: Repository and conformance contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install validation, quality, and build tools
        run: python -m pip install ".[validation,quality]" "build>=1.2,<2"

      - name: Check formatting and imports
        run: |
          python -m ruff check src tests tools examples
          python -m ruff format --check src tests tools examples

      - name: Check package types
        run: python -m mypy src

      - name: Test repository tools
        run: python -B -m unittest discover -s tools -p "test_*.py" -v

      - name: Check repository and conformance contracts
        run: python -B tools/check_repository.py

      - name: Run the minimal transaction example
        run: python -B examples/minimal_transaction.py

      - name: Compile Python sources
        run: python -B -m compileall -q src tools examples

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution contents and metadata
        run: python -B tools/check_distribution.py dist

  lean:
    name: Lean model
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the pinned Lean project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: formal/lean
          use-github-cache: false
          use-mathlib-cache: false
          leanchecker: false
