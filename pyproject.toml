[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-execution-runtime"
version = "0.1.0.dev0"
description = "A research runtime for explicit state ownership and bounded Whisper execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Bilal Medjani" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["whisper", "speech-recognition", "inference", "runtime", "scheduling"]

[project.urls]
Repository = "https://github.com/billmedj/whisper-runtime"
Issues = "https://github.com/billmedj/whisper-runtime/issues"

[project.optional-dependencies]
validation = ["jsonschema>=4.23,<5"]
quality = ["mypy>=1.16,<2", "ruff>=0.12,<1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
whisper_runtime = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
