<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">Text arrives before the recording ends</title>
  <desc id="desc">Audio goes through Whisper to produce preview text. After checks, text can be confirmed. The train sentence is an example.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#087E8B" stroke-width="1.5"/></marker>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#12343B}
      .title{font-family:'Arial Nova',Helvetica,Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:-.6px}
      .label{font-size:21px;font-weight:600}.sample{font-size:25px}.note{font-size:17px;fill:#52666A}
      .arrow{fill:none;stroke:#087E8B;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="360" rx="12" fill="#FFFFFF"/>
  <text class="title" x="36" y="48">Text arrives before the recording ends.</text>
  <text class="label" x="36" y="121">Audio</text>
  <path d="M36 152H51L57 137L66 170L77 124L89 173L99 145L107 157H134" fill="none" stroke="#087E8B" stroke-width="3" stroke-linejoin="round"/>
  <path class="arrow" d="M160 141H238"/>
  <rect x="257" y="99" width="170" height="84" rx="8" fill="#EAF6F4"/>
  <text class="label" x="299" y="149">Whisper</text>
  <path class="arrow" d="M445 141H494"/>
  <text class="label" x="519" y="119">Preview</text>
  <text class="sample" x="519" y="154" style="fill:#52666A">The train leaves…</text>
  <path class="arrow" d="M342 184V262H494"/>
  <text class="note" x="360" y="241">After checks</text>
  <text class="label" x="519" y="242">Confirmed</text>
  <text class="sample" x="519" y="278">The train leaves at nine.</text>
  <path d="M519 291H795" stroke="#087E8B" stroke-width="3"/>
  <text class="note" x="36" y="331">Example transcript</text>
</svg>
