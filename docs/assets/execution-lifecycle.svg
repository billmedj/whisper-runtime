<svg xmlns="http://www.w3.org/2000/svg" width="880" height="390" viewBox="0 0 880 390" role="img" aria-labelledby="title desc">
  <title id="title">A request, from start to finish</title>
  <desc id="desc">Reserve capacity, decode, then wait for work to finish. Keep valid results and return capacity after cleanup. If completion is unknown, keep capacity reserved.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#087E8B" stroke-width="1.5"/></marker>
    <style>
      text{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#12343B}
      .title{font-family:'Arial Nova',Helvetica,Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:-.6px}
      .label{font-size:23px;font-weight:600}.note{font-size:18px;fill:#52666A}
      .arrow{fill:none;stroke:#087E8B;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="880" height="390" rx="12" fill="#FFFFFF"/>
  <text class="title" x="36" y="48">A request, from start to finish</text>
  <text class="label" x="36" y="126">Reserve capacity</text>
  <path class="arrow" d="M244 119H300"/>
  <text class="label" x="327" y="126">Decode</text>
  <text class="note" x="327" y="153">One step at a time</text>
  <path class="arrow" d="M491 119H548"/>
  <rect x="572" y="89" width="272" height="91" rx="8" fill="#EAF6F4"/>
  <text class="label" x="596" y="125">Wait for work</text>
  <text class="label" x="596" y="153">to finish</text>
  <path class="arrow" d="M656 180V218H181V273"/>
  <text class="note" x="274" y="206">Done</text>
  <path class="arrow" d="M762 180V273"/>
  <text class="note" x="776" y="232">Unknown</text>
  <path d="M36 291V351" stroke="#087E8B" stroke-width="4"/>
  <text class="label" x="56" y="310">Keep valid results.</text>
  <text class="label" x="56" y="343">Return capacity.</text>
  <text class="label" x="576" y="310">Keep capacity</text>
  <text class="label" x="576" y="343">reserved.</text>
</svg>
